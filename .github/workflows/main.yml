name: Convert MD to PDF
on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Convert via Pandoc Docker
        # 1. -v "$(pwd):/data" maps repo root to container workspace
        # 2. -f markdown-yaml_metadata_block ignores broken headers in source MDs
        # 3. [0-9]*/Readme.md ensures chapters are merged in numerical order
        run: |
          docker run --rm -v "$(pwd):/data" pandoc/extra \
          -f markdown-yaml_metadata_block \
          [0-9]*/Readme.md Readme.md \
          -o system_design_notes.pdf \
          --metadata title="System Design Notes" \
          --toc \
          --toc-depth=2 \
          --pdf-engine=weasyprint

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: system-design-pdf
          path: system_design_notes.pdf
