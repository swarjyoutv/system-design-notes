name: Convert MD to PDF
on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Convert via Pandoc Docker
        # Mapping the workspace to /data allows the container to see your files
        # weasyprint handles GitHub-flavored Markdown (GFM) tables and images reliably
        run: |
          docker run --rm -v "$(pwd):/data" pandoc/extra \
          [0-9]*/Readme.md Readme.md \
          -o system_design_notes.pdf \
          --metadata title="System Design Notes" \
          --strip-metadata \
          --toc \
          --toc-depth=2 \
          --pdf-engine=weasyprint

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: system-design-pdf
          path: system_design_notes.pdf
