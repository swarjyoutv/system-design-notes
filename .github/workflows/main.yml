name: Convert MD to PDF
on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pandoc and PDF Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf xvfb

      - name: Run Conversion
        # --strip-metadata ignores broken YAML headers in the source MD files
        # --metadata title sets a manual title for the generated PDF
        run: |
          xvfb-run pandoc [0-9]*/Readme.md Readme.md \
          -o system_design_notes.pdf \
          --metadata title="System Design Notes" \
          --strip-metadata \
          --toc \
          --toc-depth=2 \
          --pdf-engine=wkhtmltopdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: system-design-pdf
          path: system_design_notes.pdf
